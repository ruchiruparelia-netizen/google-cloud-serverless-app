# ==============================================================================
# Declarative Knative / Google Cloud Run Service Manifest (IaC)
# Deploy via: gcloud run services replace deployment.yaml --region=us-central1
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: jpmc-card-fraud-agent
  labels:
    app: jpmc-card-fraud-agent
    platform: google-adk-enterprise
    domain: consumer-community-banking
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/ruchi-agent-poc/jpmc-agents-repo/jpmc-card-fraud-agent:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "ruchi-agent-poc"
            - name: GOOGLE_CLOUD_REGION
              value: "us-central1"
            - name: JPMC_REASONING_PRO_MODEL
              value: "gemini-2.5-pro"
            - name: JPMC_FAST_FLASH_MODEL
              value: "gemini-2.5-flash"
            - name: JPMC_LITE_TELEMETRY_MODEL
              value: "gemini-2.5-flash-lite"
            - name: HITL_DISPUTE_THRESHOLD_USD
              value: "2500.00"
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
